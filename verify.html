<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LA · Verify · 6D-Achsen</title>

<style>
body { background:#000; color:#0ff; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
pre { background:#111; padding:12px; border:1px solid #333; border-radius:6px; }
.axis { color:#0f0; }
.status { color:#6cf; }
</style>

<script>
async function load() {
    const r = await fetch("LA.json");
    return r.ok ? await r.json() : null;
}

function render(data) {
    if (!data) {
        document.getElementById("status").textContent = "FEHLT";
        return;
    }

    document.getElementById("achsen").textContent =
        data.X + " / " +
        data.Y + " / " +
        data.Z + " / " +
        data.U + " / " +
        data.V + " / " +
        data.W;

    document.getElementById("status").textContent = "OK · 6D geladen";
}

async function start() {
    const data = await load();
    render(data);
}
</script>
</head>

<body onload="start()">

<h1>LA · Verify</h1>

<h2>6D-Achsen</h2>
<pre id="achsen" class="axis">Lade…</pre>

<h2>Status</h2>
<pre id="status" class="status">Lade…</pre>

</body>
</html>
